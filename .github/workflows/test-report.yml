name: MCP Inspector Test Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for running the test suite'
        required: false
        default: 'development'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-report:
    name: Run MCP Tests & Generate Report
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mcp-inspector-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp-inspector-demo/package-lock.json

      - name: Clean install dependencies
        run: npm ci

      - name: Run MCP automated test report suite
        run: npm run test:report

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-test-report
          path: mcp-inspector-demo/reports/mcp-test-report.html
          retention-days: 30
